name: Aggiorna Calendario Cedole

on:
  schedule:
    - cron: '0 6 * * *' # Esegue lo script ogni giorno alle 06:00 UTC
  workflow_dispatch: # Permette l'esecuzione manuale

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configurazione di Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione dipendenze
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esecuzione script Python
        env:
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY }}
        run: python portfolio.py

      - name: Commit e push del file ICS aggiornato
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.ics
          git commit -m "Aggiornamento automatico file ICS [skip ci]" || exit 0
          git push
